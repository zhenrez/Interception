name: Package Interception MVP

on:
  push:
    branches:
      - feat/chatgpt-plugin-mailbox
      - feat/operational-inference
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage clean package
        run: |
          git archive --format=zip --prefix=Interception/ --output=Interception-MVP.zip HEAD
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Interception-MVP
          path: Interception-MVP.zip
          if-no-files-found: error
